version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: classsight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: classsight_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: classsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classsight_user -d classsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
